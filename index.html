<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Cheat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0d0e15;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #ff0055, #7000ff);
            border-radius: 50%;
            top: -50px;
            left: -50px;
            filter: blur(150px);
            opacity: 0.5;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #00ffcc, #0072ff);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            filter: blur(150px);
            opacity: 0.5;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        p {
            color: #8a8b98;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .download-btn {
            position: relative;
            text-decoration: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #7000ff, #ff0055);
            background-size: 200% auto;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            outline: none;
            box-shadow: 0 10px 20px rgba(112, 0, 255, 0.3);
            transition: 0.5s ease;
            width: 100%;
            max-width: 280px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .download-btn:hover {
            background-position: right center;
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.5);
            transform: translateY(-3px);
        }

        .download-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(255, 0, 85, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(112, 0, 255, 0.4), 0 10px 20px rgba(112, 0, 255, 0.3);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(112, 0, 255, 0), 0 10px 20px rgba(112, 0, 255, 0.3);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(112, 0, 255, 0), 0 10px 20px rgba(112, 0, 255, 0.3);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.7rem;
            }
            p {
                font-size: 0.85rem;
                margin-bottom: 25px;
            }
            .download-btn {
                padding: 14px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cheat Loader</h1>
        <p>Нажмите кнопку ниже, чтобы скачать последнюю версию конфигурации cheat.sh для вашего устройства.</p>
        <div class="btn-container">
            <a href="cheat.sh" download="cheat.sh" class="download-btn">Скачать файл</a>
        </div>
    </div>

</body>
</html>
